<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
</main>
    
<style>
    body{
        background-color: #FAE29E;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    main{
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr;
        grid-template-rows: 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr;
        height: 80%;
        width: 80%;
    }
    main div:nth-child(1){
        grid-column: 1/5;
        height: 100%;
        width: 100%;
        background-color: #469DBA;
    }
    main div:nth-child(2){
        grid-column: 1/5;
        grid-row: 3/4;
        height: 100%;
        width: 100%;
        background-color: #469DBA;
    }
     main div:nth-child(3){
        grid-column: 4/5;
        grid-row: 4/7;
        height: 100%;
        width: 100%;
        background-color: #469DBA;
    }
     main div:nth-child(4){
        grid-column: 6/7;
        grid-row: 3/7;
        height: 100%;
        width: 100%;
        background-color: #469DBA;
    }
</style>
</body>
</html>
